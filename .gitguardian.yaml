# Configuración de GitGuardian (formato v2: sin `version: 2`, ggshield lo lee como v1 obsoleto).
#
# Esto solo aplica a la CLI `ggshield` local (el hook de pre-commit). El check de GitGuardian
# que corre en cada PR es su GitHub App del lado del servidor y NO lee este archivo —de ahí que
# antes marcara «Generic Password» en cada PR que añadía un test con usuario pese a tener la
# contraseña silenciada aquí (decidido por Nelson el 2026-10-03). La solución real está en el
# código: ningún test, fixture ni helper de E2E escribe ya una contraseña literal; los usuarios
# efímeros de prueba reciben una generada en tiempo de ejecución (`testPassword()`, en
# `apps/api/src/test/passwords.ts` para la API y `apps/web/e2e/helpers.ts` para los E2E). Ver
# `docs/conventions.md` §8.
#
# Lo único que queda silenciado aquí es el valor de ejemplo de ADMIN_PASSWORD en
# `apps/api/.env.example`/`.env.test` (y su fallback en `e2e/helpers.ts`): ya es público en el
# repo, así que silenciarlo no oculta nada. Por eso mismo la contraseña real del admin en
# producción NUNCA puede ser esta.
version: 2

secret:
  ignored_matches:
    - name: contraseña de ejemplo del admin (ADMIN_PASSWORD en .env.example/.env.test)
      match: Admin12345!
