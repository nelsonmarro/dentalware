name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentalware
          POSTGRES_PASSWORD: dentalware
          POSTGRES_DB: dentalware_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dentalware -d dentalware_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentalware
          POSTGRES_PASSWORD: dentalware
          POSTGRES_DB: dentalware
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dentalware -d dentalware"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      HUSKY: 0
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.env.example apps/api/.env
      - run: pnpm --filter @dentalware/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @dentalware/shared build # la API importa @dentalware/shared desde dist/ al arrancar
      - run: pnpm --filter @dentalware/web exec playwright test # los 3 proyectos; WebKit (iphone) solo corre fiable en Ubuntu/CI
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
