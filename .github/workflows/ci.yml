name: CI

on:
  push:
    branches: [main]
  pull_request:

# Niveles de pruebas (docs/conventions.md §7): el PR corre los unit completos y los E2E
# `@esencial` + `@clave` en escritorio y android (Chromium) y solo los `@esencial` en iphone
# (WebKit; `E2E_PR=1` activa el `grep` de ese proyecto, #133); el push a main corre todo,
# incluido `@extendida`. Los jobs corren en paralelo.
# Un push nuevo a la misma rama de un PR cancela la corrida anterior; en main nunca se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  E2E_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
  PW_ARGS: ${{ github.event_name == 'pull_request' && '--project=escritorio --project=android --project=iphone --grep "@esencial|@clave"' || '' }}

jobs:
  # Infraestructura: scripts de infra/ con shellcheck y Caddy real (cabeceras de caché, healthcheck), imagen de la API (tamaño, arranque) e imagen del manual (sitio, cabeceras, healthcheck).
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: find infra -name '*.sh' -print0 | xargs -0 shellcheck -x
      - run: bash infra/tests/caddy-headers.sh
      - run: bash infra/tests/api-image.sh
      - run: bash infra/tests/docs-image.sh

  # Respaldos (#111, PEM-3): respalda con restic, simula el desastre (`down -v`) y restaura de
  # punta a punta, sin red externa (repositorio de restic en una carpeta temporal).
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Unidades de systemd (systemd-analyze) e install.sh --dry-run: rápido y sin Docker.
      - run: bash infra/tests/backup-units.sh
      - run: bash infra/tests/backup-roundtrip.sh

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentalware
          POSTGRES_PASSWORD: dentalware
          POSTGRES_DB: dentalware_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dentalware -d dentalware_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Store de pnpm cacheado por lockfile: `pnpm install` solo enlaza lo ya descargado.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # En la imagen oficial de Playwright (#141): trae Chromium y WebKit con sus librerías, así que
    # el job no instala navegadores ni pasa por apt (el mirror del runner tardó entre 6 y 30 min
    # varias veces y mató el job por timeout). La versión va en el nombre de la imagen porque
    # `container.image` no admite `env`: `ci-imagen-playwright.test.ts` exige que coincida con el
    # catalog de pnpm-workspace.yaml. `--user 1001` como recomienda Playwright (no correr como
    # root) e `--ipc=host` para que Chromium no se quede sin memoria compartida.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentalware
          POSTGRES_PASSWORD: dentalware
          POSTGRES_DB: dentalware_test
        options: >-
          --health-cmd "pg_isready -U dentalware -d dentalware_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      # Desde un job en contenedor el servicio se alcanza por su nombre, no por el
      # `localhost:5433` de apps/api/.env.test; `loadConfig` no pisa lo ya definido en el entorno
      # y Playwright pasa el entorno del job a los `webServer` (la API, `reset-test-db` y `seed`).
      DATABASE_URL: postgres://dentalware:dentalware@postgres:5432/dentalware_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Store de pnpm cacheado por lockfile: `pnpm install` solo enlaza lo ya descargado.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # apps/api/.env.test ya está commiteado (BD dentalware_test); playwright.config.ts
      # fija NODE_ENV=test para el webServer de la API, así que `loadConfig` lo carga solo
      # (salvo DATABASE_URL, que viene del entorno del job: ver arriba)
      - run: pnpm --filter @dentalware/shared build # la API importa @dentalware/shared desde dist/ al arrancar
      - run: pnpm --filter @dentalware/web exec playwright test ${{ env.PW_ARGS }}
      # Barrido del manual construido (#137): objetivos táctiles, rótulos, landmarks.
      - run: pnpm --filter @dentalware/docs sitio
      # Informe HTML y trazas (`trace: on-first-retry`): sin ellos un fallo solo en CI no se
      # puede depurar (#133). `playwright-report` solo existe con el reporter `html` del config.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/docs/test-results
          if-no-files-found: warn
