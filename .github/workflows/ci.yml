name: CI

on:
  push:
    branches: [main]
  pull_request:

# Niveles de pruebas (docs/conventions.md §7): el PR corre los unit completos y los E2E
# `@esencial` + `@clave` en escritorio y android (solo Chromium); el push a main corre
# todo, incluido `@extendida` e iphone (WebKit). Los dos jobs corren en paralelo.
# Un push nuevo a la misma rama de un PR cancela la corrida anterior; en main nunca se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  PW_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}
  PW_ARGS: ${{ github.event_name == 'pull_request' && '--project=escritorio --project=android --grep "@esencial|@clave"' || '' }}

jobs:
  # Infraestructura: scripts de infra/ con shellcheck y Caddy real (cabeceras de caché, healthcheck) e imagen de la API (tamaño, arranque).
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: find infra -name '*.sh' -print0 | xargs -0 shellcheck -x
      - run: bash infra/tests/caddy-headers.sh
      - run: bash infra/tests/api-image.sh

  # Respaldos (#111, PEM-3): respalda con restic, simula el desastre (`down -v`) y restaura de
  # punta a punta, sin red externa (repositorio de restic en una carpeta temporal).
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Unidades de systemd (systemd-analyze) e install.sh --dry-run: rápido y sin Docker.
      - run: bash infra/tests/backup-units.sh
      - run: bash infra/tests/backup-roundtrip.sh

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentalware
          POSTGRES_PASSWORD: dentalware
          POSTGRES_DB: dentalware_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dentalware -d dentalware_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Store de pnpm cacheado por lockfile: `pnpm install` solo enlaza lo ya descargado.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentalware
          POSTGRES_PASSWORD: dentalware
          POSTGRES_DB: dentalware_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U dentalware -d dentalware_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # Store de pnpm cacheado por lockfile: `pnpm install` solo enlaza lo ya descargado.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Navegadores cacheados por versión de Playwright (fijada en el catalog de
      # pnpm-workspace.yaml); las dependencias del sistema se instalan siempre (apt, rápido).
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_BROWSERS }}-${{ hashFiles('pnpm-workspace.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @dentalware/web exec playwright install ${{ env.PW_BROWSERS }}
      - run: pnpm --filter @dentalware/web exec playwright install-deps ${{ env.PW_BROWSERS }}
      # apps/api/.env.test ya está commiteado (BD dentalware_test); playwright.config.ts
      # fija NODE_ENV=test para el webServer de la API, así que `loadConfig` lo carga solo
      - run: pnpm --filter @dentalware/shared build # la API importa @dentalware/shared desde dist/ al arrancar
      - run: pnpm --filter @dentalware/web exec playwright test ${{ env.PW_ARGS }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
